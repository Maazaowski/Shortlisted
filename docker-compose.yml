# The whole product on one machine.
#
#   docker compose up -d --build   build and start everything
#   docker compose logs -f worker  watch generation
#   docker compose down            stop (data is kept)
#   docker compose down -v         stop and wipe the database
#
# ANTHROPIC_API_KEY, SHORTLISTED_PROVIDER, SHORTLISTED_MODEL and WEB_PORT are read from the root .env
# by Compose's own interpolation. env_file is deliberately not used: the .env
# also holds the host-side DATABASE_URL, which must not leak into the containers.
#
# Ports bind to 127.0.0.1 because there is no auth. Only this machine can reach
# the app. The extension talks to http://localhost:${WEB_PORT}.
#
# Developing on the host: `docker compose up -d db`, then `pnpm web` and
# `pnpm worker`, with .env pointing DATABASE_URL at localhost:5434.
name: shortlisted

x-app-env: &app-env
  DATABASE_URL: postgresql://postgres:postgres@db:5432/shortlisted
  STORAGE_DIR: /data/files
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  SHORTLISTED_PROVIDER: ${SHORTLISTED_PROVIDER:-}
  SHORTLISTED_MODEL: ${SHORTLISTED_MODEL:-}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shortlisted
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shortlisted"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    image: shortlisted:local
    command: ["pnpm", "--filter", "@shortlisted/db", "migrate:deploy"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    image: shortlisted:local
    command: ["pnpm", "--filter", "@shortlisted/web", "start"]
    environment: *app-env
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ./data/files:/data/files
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: shortlisted:local
    command: ["node", "apps/worker/dist/index.js"]
    environment: *app-env
    volumes:
      - ./data/files:/data/files
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  db_data:
