# The companies whose job boards the feed reads. This file is the curation.
#
# One company per line:
#   - { ats: greenhouse, board: gitlab, name: GitLab }
#
#   ats    the job board system: greenhouse, lever, ashby, workable or recruitee
#   board  the company's id on that system, the part of its jobs page address
#          that names the company (boards.greenhouse.io/gitlab -> gitlab)
#   name   the company's name as people know it. For UK roles it is also
#          compared with the register of licensed visa sponsors.
#
# To add a company, add a line and run:
#   pnpm --filter @shortlisted/feed check-boards
# A board that stops answering is skipped by the build and reported in its log.

