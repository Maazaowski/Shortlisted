<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shortlisted</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="top">
      <span class="brand">Shortlisted<i>.</i></span>
      <button id="settings-toggle" class="link" type="button">Settings</button>
    </header>

    <section id="settings" class="box" hidden>
      <label>Web app address <input id="api-base" type="url" placeholder="http://localhost:3000" /></label>
      <div class="row">
        <button id="save-settings" type="button">Save</button>
      </div>
    </section>

    <section id="not-connected" class="box" hidden>
      <p id="not-connected-message">Checking the web app.</p>
      <a id="open-app" href="#" target="_blank"><button type="button" class="primary">Open Shortlisted</button></a>
    </section>

    <section id="ready" hidden>
      <div class="box">
        <div id="tab-title" class="muted small"></div>
        <button id="capture" type="button" class="primary wide">Tailor for this page</button>
        <div id="status" class="small"></div>
      </div>
      <div id="result" hidden></div>
    </section>
    <script src="sidepanel.js"></script>
  </body>
</html>
