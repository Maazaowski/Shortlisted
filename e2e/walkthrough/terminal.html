<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Terminal</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f6f3ec; font-family: system-ui, "Segoe UI", sans-serif; }
      .who { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); font: 600 12px/1 system-ui, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #c8401a; }
      .window { position: fixed; inset: 56px 110px 130px; border-radius: 12px; background: #16161a; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28); display: flex; flex-direction: column; overflow: hidden; }
      .bar { height: 34px; background: #24242b; display: flex; align-items: center; gap: 8px; padding: 0 14px; color: #9a9aa6; font: 500 12px system-ui, sans-serif; }
      .dot { width: 11px; height: 11px; border-radius: 50%; background: #4a4a55; }
      .title { margin-left: 10px; }
      .note { margin-left: auto; color: #77778a; }
      pre { margin: 0; padding: 16px 20px; overflow: hidden; color: #e7e7ea; font: 14px/1.5 "Cascadia Mono", Consolas, "Courier New", monospace; white-space: pre-wrap; word-break: break-word; }
      .hold { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
      .prompt { color: #7fd39a; }
      .cmd { color: #fff; }
      .dim { color: #8f8f9c; }
    </style>
  </head>
  <body>
    <div class="who" id="who"></div>
    <div class="window">
      <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="title" id="title"></span><span class="note" id="note"></span></div>
      <div class="hold"><pre id="screen"></pre></div>
    </div>
    <script>
      // The page is driven from outside: window.play(session) types the command,
      // then prints the captured output. Long quiet stretches are shortened.
      const screen = document.getElementById("screen");
      const lines = [];
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
      // Colour codes and cursor moves are dropped; a carriage return restarts the line.
      const clean = (s) => s.replace(/\x1b\[[0-9;?]*[A-Za-z]/g, "").replace(/\r\n/g, "\n");
      let current = "";
      function draw() {
        const shown = [...lines, current].slice(-22);
        screen.innerHTML = shown.join("\n");
      }
      function write(text) {
        for (const ch of clean(text)) {
          if (ch === "\n") { lines.push(current); current = ""; }
          else if (ch === "\r") current = "";
          else current += esc(ch);
        }
        draw();
      }
      window.setup = ({ who, title, note }) => {
        document.getElementById("who").textContent = who || "";
        document.getElementById("title").textContent = title || "";
        document.getElementById("note").textContent = note || "";
      };
      window.play = async ({ prompt, command, chunks, speed = 1, maxGap = 900, typeDelay = 38 }) => {
        current = `<span class="prompt">${esc(prompt)}</span> <span class="cmd">`;
        draw();
        for (const ch of command) { current += esc(ch); draw(); await sleep(typeDelay * speed); }
        current += "</span>";
        await sleep(500 * speed);
        lines.push(current); current = ""; draw();
        let last = 0;
        for (const c of chunks || []) {
          await sleep(Math.min(maxGap, Math.max(0, c.t - last)) * speed);
          last = c.t;
          write(c.text);
        }
        if (current) { lines.push(current); current = ""; }
        draw();
      };
      window.say = (text) => { lines.push(`<span class="dim">${esc(text)}</span>`); draw(); };
      window.clearScreen = () => { lines.length = 0; current = ""; draw(); };
    </script>
  </body>
</html>
